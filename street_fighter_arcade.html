<body>
<main class="cabinet" id="cabinet">
 <header class="topbar">
  <div class="brand">STREET <span>DUEL</span></div>
  <div class="top-tools"><span class="badge">1 PLAYER · ARCADE</span><button class="tool" id="sound" type="button" aria-pressed="true">音 ON</button><button class="tool" id="pause" type="button">一時停止</button></div>
 </header>
 <div class="screen" id="screen">
  <canvas id="game" width="960" height="540" aria-label="格闘ゲームの対戦画面"></canvas>
  <div class="overlay" id="menu">
   <section class="panel">
    <p class="eyebrow" id="menu-eyebrow">HARBOR DISTRICT · NIGHT 01</p>
    <h1 class="title" id="menu-title">STREET<br><span>DUEL</span></h1>
    <p class="description" id="menu-desc">パンチ・キック・気弾でCPUに挑め。<br>2ラウンド先取で勝利！</p>
    <div class="level-row" id="levels" aria-label="CPUの強さ">
     <button class="level" type="button" data-level="easy" aria-pressed="false">やさしい</button><button class="level" type="button" data-level="normal" aria-pressed="true">ふつう</button><button class="level" type="button" data-level="hard" aria-pressed="false">強い</button>
    </div>
    <button class="primary" id="start" type="button">キャラを選んで対戦</button>
    <button class="secondary" id="restart" type="button" hidden>最初から対戦</button>
   </section>
  </div>
  <div class="error" id="error" hidden role="alert"></div>
  <noscript><div class="error">このゲームはJavaScriptを使います。Safariの設定でJavaScriptを有効にしてください。</div></noscript>
 </div>
 <div class="picker" id="picker" hidden role="dialog" aria-modal="true" aria-labelledby="pick-title">
  <section class="pick-panel"><h2 id="pick-title">キャラクターを選択</h2><div class="roster" id="roster"></div><p class="pick-detail" id="pick-detail"></p><button class="primary" id="pick-start" type="button">このキャラで対戦</button><button class="secondary" id="pick-back" type="button">戻る</button></section>
 </div>
 <div class="deck" id="controls" aria-label="タッチ操作">
  <div class="dpad">
   <button class="control dir up" data-action="jump" type="button" aria-label="ジャンプ">▲</button>
   <button class="control dir left" data-action="left" type="button" aria-label="左に移動">◀</button>
   <button class="control dir down" data-action="down" type="button" aria-label="しゃがむ">▼</button>
   <button class="control dir right" data-action="right" type="button" aria-label="右に移動">▶</button>
  </div>
  <div class="deck-note"><b><span id="match-names">REN vs VEX</span></b><br>ガードは長押し / 必殺技は気力60<br>移動しながら攻撃できます</div>
  <div class="actions">
   <button class="control action punch" data-action="punch" type="button">パンチ<small>PUNCH</small></button>
   <button class="control action kick" data-action="kick" type="button">キック<small>KICK</small></button>
   <button class="control action guard" data-action="guard" type="button">ガード<small>HOLD</small></button>
   <button class="control action special" data-action="special" type="button">気弾<small>気力30</small></button>
   <button class="control action skill" data-action="skill" type="button">必殺技<small>気力60</small></button>
  </div>
 </div>
 <p class="orientation">横向きにすると、対戦画面を大きく表示できます。</p>
 <p class="instructions"><strong>タッチ：</strong>画面下のボタンで操作　<strong>PC：</strong>← → 移動 / ↑ ジャンプ / ↓ しゃがむ<br>Z パンチ / X キック / C 気弾 / D 必殺技 / Space ガード / Esc 一時停止</p>
 <div class="sr-only" id="status" aria-live="polite">対戦スタートを押すと始まります。</div>
</main>
<script>

 function text(s,x,y,size,color,align,weight){ctx.font=(weight||'900')+' '+size+'px -apple-system,BlinkMacSystemFont,"Arial",sans-serif';ctx.textAlign=align||'left';ctx.fillStyle=color;ctx.fillText(s,x,y);}
 function drawHud(f,flip){

 function banner(big,small,color){ctx.fillStyle='#06142499';ctx.fillRect(0,178,W,132);text(big,480,251,65,color||'#ffdb80','center');if(small)text(small,480,285,18,'#fff4d7','center','700');}
 function draw() {
  ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);ctx.clearRect(0,0,W,H);ctx.save();
  if(cameraShake>0&&phase==='fight')ctx.translate((Math.random()-.5)*cameraShake,(Math.random()-.5)*cameraShake);
  ctx.drawImage(stage,0,0);
  // Passing lights and spectators animate without loading external resources.
  for(var i=0;i<9;i++){var sx=155+i*72;ellipse(sx,352+Math.sin(clock*(i%3+2)+i)*2,8,8,i%2?'#222a43':'#364057');ctx.fillStyle=i%2?'#333754':'#59667e';ctx.fillRect(sx-7,361,14,33);}

  ctx.restore();drawHud(p,false);drawHud(cpu,true);

 function loop(t) {
  if(!runningLoop)return;
  if(!lastFrame)lastFrame=t;
  accumulator+=Math.min((t-lastFrame)/1000,.1);lastFrame=t;
  try{while(accumulator>=STEP){step(STEP);accumulator-=STEP;}draw();}catch(e){runningLoop=false;document.getElementById('error').hidden=false;document.getElementById('error').textContent='ゲームが停止しました。ページを再読み込みしてください。';console.error(e);return;}
  window.requestAnimationFrame(loop);
