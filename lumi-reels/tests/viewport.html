<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMI レイアウト検証</title><style>html,body{margin:0;background:#0e101a;color:#d7e6dc;font:12px sans-serif}header{height:50px;display:flex;align-items:center;justify-content:center;gap:14px}select,button{background:#33433f;color:white;border:1px solid #637971;border-radius:6px;padding:6px;font:12px sans-serif}.frame-wrap{display:flex;justify-content:center}iframe{width:390px;height:844px;border:1px solid #384d47;box-sizing:content-box}label{display:flex;align-items:center;gap:5px}</style></head><body><header><label>検証サイズ<select id="viewportSize"><option value="390,844">390 × 844 縦</option><option value="375,667">375 × 667 縦</option><option value="320,568">320 × 568 縦</option><option value="844,390">844 × 390 横</option><option value="667,375">667 × 375 横</option><option value="768,1024">768 × 1024 縦</option><option value="1024,768">1024 × 768 横</option></select></label><span id="sizeStatus">ready 390,844</span><label>開発モード<input id="devMode" type="checkbox"></label><span>ChromeのiframeでCSS・画面サイズを検証。実機iOSではありません。</span></header><div class="frame-wrap"><iframe id="gameFrame" src="../index.html" title="サイズ検証用スロット"></iframe></div><script>const frame=document.querySelector('#gameFrame');document.querySelector('#viewportSize').addEventListener('change',e=>{const [w,h]=e.target.value.split(',');frame.style.width=w+'px';frame.style.height=h+'px';document.querySelector('#sizeStatus').textContent='resizing';const tick=()=>{const d=frame.contentDocument,canvas=d&&d.querySelector('#reel0'),reel=d&&d.querySelector('#reelWindow');if(d&&d.documentElement.style.getPropertyValue('--app-height')===h+'px'&&canvas&&reel&&Math.abs(canvas.getBoundingClientRect().height-(reel.getBoundingClientRect().height-2))<1){document.querySelector('#sizeStatus').textContent='ready '+w+','+h;}else setTimeout(tick,25);};setTimeout(tick,25);});document.querySelector('#devMode').addEventListener('change',e=>{frame.src='../index.html'+(e.target.checked?'?dev=1':'');});</script></body></html>
